name: Deploy DOCKLINE to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare festival server download
        run: |
          zip -qr "$RUNNER_TEMP/dockline-lan.zip" art-source PLAY-KO.txt start-windows.cmd package.json server.mjs dist -x dist/dockline-lan.zip
          mv "$RUNNER_TEMP/dockline-lan.zip" dist/dockline-lan.zip
          mkdir -p dist/api
          printf '%s\n' '{"docklineLAN":false}' > dist/api/capabilities
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
