<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10212c"><title>DOCKLINE · 도크라인</title>
  <meta name="description" content="세관 4번 창고와 서밋 옥상에서 일곱 가지 주무기로 더미 사격장과 1v1·2v2·3v3 팀전을 플레이하세요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23f4cf52'/%3E%3Cpath d='m5 24 7-16h12l2 5-4 9-5 2zm8-5h4l3-6h-4z' fill='%2313222a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./arena-ui.css">
  <link rel="stylesheet" href="./online-ui.css">
  <link rel="stylesheet" href="./combat-ui.css">
  <link rel="stylesheet" href="./armory-viewer.css">
</head>
<body data-scene="lobby">
  <canvas id="arena" aria-label="도크라인 세관 4번 창고" tabindex="-1"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="lobby-shell">
  <header id="mast">
    <div class="brand" aria-label="도크라인"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M0 29 12 3h20l-3 7H17L8 29zm13 0 7-15h10l2-4 4-7h6l4 7-6 12-11 7zm11-7h5l5-4 2-4h-8z"/></svg><span>DOCKLINE</span></div>
    <div class="top-actions">
      <button id="helpBtn" class="help-action" aria-label="조작 안내" title="조작 안내"><span data-icon="keyboard"></span><span class="help-label">조작 안내</span></button>
      <button id="soundBtn" class="icon-btn" aria-label="소리 끄기" title="소리 끄기"></button>
      <button id="settingsBtn" class="icon-btn" aria-label="게임 설정" title="게임 설정"></button>
    </div>
  </header>
  <main id="home">
    <div class="home-title">
      <div class="map-pick"><label for="arenaPick">경기장</label><select id="arenaPick" disabled></select></div>
      <h1 lang="en"><b id="arenaTitle">CUSTOMS 04</b><span aria-hidden="true"></span></h1>
      <p><span data-icon="pin"></span><span id="arenaBlurb">중앙 계근대, 서쪽 검수 통로, 동쪽 하역 데크</span></p>
    </div>
    <div class="lobby-deck">
      <section class="play-options" aria-labelledby="playTitle">
        <h2 id="playTitle">플레이</h2>
        <div class="start-actions">
          <button class="primary" id="teamBtn" disabled><span class="mode-icon" data-icon="users"></span><span class="mode-name">친구와 대전</span><span class="mode-note">코드 참가 · 방 만들기</span></button>
          <button class="secondary" id="rangeBtn" disabled><span class="mode-icon" data-icon="play"></span><span class="mode-name">더미 사격장</span><span class="mode-note">혼자 연습</span></button>
        </div>
        <p class="match-rules">1v1 · 2v2 · 3v3 <span aria-hidden="true">/</span> 3선승 · 라운드당 40초</p>
        <p id="boot" role="status">경기장 준비 중…</p>
      </section>
      <section id="arsenal" aria-labelledby="loadoutTitle">
        <div class="loadout-heading">
          <h2 id="loadoutTitle">주무기 선택</h2>
          <button type="button" id="inspectBtn" aria-haspopup="dialog"><span data-icon="inspect"></span>무기 자세히 보기</button>
        </div>
        <div class="gun-options" role="group" aria-labelledby="loadoutTitle">
          <button data-weapon="rifle" aria-pressed="true"><img src="./assets/loadout-rifle.png" alt=""><span>돌격소총</span></button>
          <button data-weapon="shotgun" aria-pressed="false"><img src="./assets/loadout-shotgun.png" alt=""><span>산탄총</span></button>
          <button data-weapon="sniper" aria-pressed="false"><img src="./assets/loadout-sniper.png" alt=""><span>저격소총</span></button>
          <button data-weapon="smg" aria-pressed="false"><img src="./assets/loadout-smg.png" alt=""><span>기관단총</span></button>
          <button data-weapon="burst" aria-pressed="false"><img src="./assets/loadout-burst.png" alt=""><span>3점사 소총</span></button>
          <button data-weapon="marksman" aria-pressed="false"><img src="./assets/loadout-marksman.png" alt=""><span>지정사수소총</span></button>
          <button data-weapon="lmg" aria-pressed="false"><img src="./assets/loadout-lmg.png" alt=""><span>경기관총</span></button>
        </div>
        <p id="gunDesc" aria-live="polite"></p>
        <div class="slot-loadout" role="group" aria-labelledby="sidearmTitle">
          <strong id="sidearmTitle">보조 무기</strong>
          <button type="button" data-sidearm="pistol" aria-pressed="true"><img src="./assets/loadout-pistol.png" alt="">권총</button>
          <button type="button" data-sidearm="revolver" aria-pressed="false"><img src="./assets/loadout-revolver.png" alt="">리볼버</button>
        </div>
        <div class="slot-loadout" role="group" aria-labelledby="knifeTitle">
          <strong id="knifeTitle">근접 무기</strong>
          <button type="button" data-knife="karambit" aria-pressed="true"><img src="./assets/loadout-karambit.png" alt="">카람빗</button>
          <button type="button" data-knife="balisong" aria-pressed="false"><img src="./assets/loadout-balisong.png" alt="">발리송</button>
        </div>
      </section>
    </div>
  </main>
  </div>
  <div id="hud" hidden>
    <div id="scoreboard"><strong id="blueScore">0</strong><div><small id="roundLabel"></small><b id="clock">0:40</b></div><strong id="redScore">0</strong></div>
    <div id="living"><span id="blueLive"></span><span id="orangeLive"></span></div>
    <div id="rangeStats" role="group" aria-label="사격 기록" hidden>
      <strong>더미 사격장</strong>
      <span>명중 <b id="rangeHits">0</b></span><span>처치 <b id="rangeKills">0</b></span><span>명중률 <b id="rangeAccuracy">–</b></span>
    </div>
    <div id="feed"></div><div id="banner" role="status"></div>
    <div id="combatDamage" aria-hidden="true"></div><div id="fragConfirm" aria-live="polite"></div>
    <div id="sight"><i></i><i></i><i></i><i></i></div><div id="hitMark"></div><div id="damage"></div>
    <div id="health"><small id="hpLabel">체력</small><b id="hp">–</b><div class="hp-line"><i id="hpBar"></i></div></div>
    <div id="weaponHud"><small id="gun"></small><strong id="ammo">–</strong><span id="rounds"></span></div>
    <div id="contextHint"></div><div id="spectator" hidden></div><button id="pauseBtn" class="icon-btn" aria-label="경기 메뉴" title="경기 메뉴"></button>
  </div>
  <dialog id="panel" aria-labelledby="panelTitle"><div class="panel-head"><h2 id="panelTitle"></h2><button class="icon-btn" id="closePanel" aria-label="닫기"></button></div><div id="panelBody"></div></dialog>
  <div id="toast" role="status"></div>
  <noscript>플레이하려면 Chrome에서 자바스크립트를 켜 주세요.</noscript>
  <script type="module" src="./app.js"></script>
</body></html>
